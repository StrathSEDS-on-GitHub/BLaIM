[package]
name = "blaim-web"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.14.0"
axum = { version = "0.8.4", features = ["macros", "tracing"] }
serde = { version = "1.0.225", features = ["derive"] }
tokio.workspace = true
sqlx.workspace = true
tower-http = { version = "0.6.6", features = ["fs", "trace", "tracing"] }
tracing-subscriber = "0.3.20"
tracing = "0.1.41"
blaim-db ={ path="../blaim-db" }
color-eyre.workspace = true
futures = "0.3.31"
rand = "0.9.2"
